services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csp_demo}
      POSTGRES_USER: ${POSTGRES_USER:-csp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - csp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://csp_app:change_me@db:5432/csp_demo?schema=public}
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://csp_app:change_me@db:5432/csp_demo?schema=public}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_32_char_secret}
      PLATFORM_ADMIN_BOOTSTRAP_KEY: ${PLATFORM_ADMIN_BOOTSTRAP_KEY:-replace_with_a_32_char_secret}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5174}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  csp_postgres_data:
