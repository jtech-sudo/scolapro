services:
  db:
    image: postgres:16-alpine
    container_name: csp-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csp_school}
      POSTGRES_USER: ${POSTGRES_USER:-csp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - csp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csp_app} -d ${POSTGRES_DB:-csp_school}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  csp_postgres_data:
